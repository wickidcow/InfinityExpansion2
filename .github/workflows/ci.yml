name: Build IE2 Legacy Fork

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "1.0.1"
  OUTPUT_NAME: "SF_InfinityExpansion21.0.1.jar"

jobs:
  paper-26-2:
    name: Paper 26.2 / Java 25 build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build Paper 26.2 target
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean shadowJar --stacktrace --console=plain --warning-mode=all -PpaperApiVersion=26.2.build.+ -PbuildVersion="${LEGACY_ARTIFACT_VERSION}" 2>&1 | tee build-paper-26.2.log
      - name: Verify Java 21 plugin bytecode
        run: |
          python3 - <<'PY'
          import glob, struct, zipfile
          jars = glob.glob('build/libs/SF_IE2Legacy*.jar')
          if not jars:
              raise SystemExit('No IE2 Legacy jar produced')
          majors = set()
          with zipfile.ZipFile(jars[0]) as z:
              for name in z.namelist():
                  if name.endswith('.class'):
                      data = z.read(name)[:8]
                      if len(data) == 8 and data[:4] == b'\xca\xfe\xba\xbe':
                          majors.add(struct.unpack('>H', data[6:8])[0])
          if 65 not in majors:
              raise SystemExit(f'Expected Java 21 class major 65; saw {sorted(majors)}')
          print('Verified Java 21-compatible plugin classes.')
          PY
      - name: Stage versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'SF_IE2Legacy*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" "dist/${OUTPUT_NAME}"
          test -s "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR release asset
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${LEGACY_ARTIFACT_VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --generate-notes --title "SF_InfinityExpansion2 $TAG"
          fi

  source-safety:
    name: Migration safety checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify migration invariants
        run: python3 scripts/verify_legacy_migration.py
