name: Publish IE2 Legacy Release

on:
  workflow_run:
    workflows: ["Build IE2 Legacy Fork"]
    types: [completed]

permissions:
  contents: write
  actions: read

env:
  LEGACY_ARTIFACT_VERSION: "1.0.1"

jobs:
  release:
    name: Publish current Legacy JAR
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download JAR from successful build
        uses: actions/download-artifact@v8
        with:
          name: SF_InfinityExpansion2_Legacy_v${{ env.LEGACY_ARTIFACT_VERSION }}.jar
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify release JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="dist/SF_InfinityExpansion2_Legacy_v${LEGACY_ARTIFACT_VERSION}.jar"
          test -s "$JAR"
          sha256sum "$JAR"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${LEGACY_ARTIFACT_VERSION}"
          JAR="dist/SF_InfinityExpansion2_Legacy_v${LEGACY_ARTIFACT_VERSION}.jar"
          TITLE="InfinityExpansion2 Legacy v${LEGACY_ARTIFACT_VERSION}"

          cat > release-notes.md <<'EOF'
          ## InfinityExpansion2 Legacy v1.0.1

          Patch release for the maintained Slimefun Legacy build of InfinityExpansion2 on Paper 26.2.

          ### Changes
          - Infinity gear now explicitly keeps real Minecraft enchantments visible in the normal item tooltip.
          - No enchantments, enchantment levels, potion effects, protections, recipes, or balance values were added or changed by this fix.
          - Release builds now pass the release version into Gradle so the plugin's internal version matches the GitHub release and output JAR.

          ### Build target
          - Paper 26.2 / Java 25 build environment.
          - Java 21-compatible addon bytecode.
          - Slimefun Legacy compatibility-focused build.
          - Direct raw JAR: `SF_InfinityExpansion2_Legacy_v1.0.1.jar`.

          This is a maintained compatibility fork. See the repository README and license for upstream credits and licensing information.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" "$JAR" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --latest
          fi
