name: Release IE2 Legacy Fork

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (example: 2.0.0-legacy.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Java and Gradle runtime
        run: |
          java -version
          ./gradlew --version

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION#v}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release JAR
        run: ./gradlew clean shadowJar --stacktrace -PpaperApiVersion=26.2.build.+ -PbuildVersion=${{ steps.version.outputs.version }}

      - name: Normalize release filename
        id: jar
        shell: bash
        run: |
          SOURCE=$(find build/libs -maxdepth 1 -name 'InfinityExpansion2-*.jar' -print -quit)
          TARGET="build/libs/InfinityExpansion2-Legacy-${{ steps.version.outputs.version }}.jar"
          cp "$SOURCE" "$TARGET"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: InfinityExpansion2-Legacy-${{ steps.version.outputs.version }}
          path: ${{ steps.jar.outputs.path }}

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          JAR="${{ steps.jar.outputs.path }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --generate-notes --title "InfinityExpansion2 Legacy $TAG"
          fi
