name: Release IE2 Legacy Fork

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (format: 1.X.XX, example: 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Java and Gradle runtime
        run: |
          java -version
          ./gradlew --version

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi

          if [[ ! "$VERSION" =~ ^1\.[0-9]\.[0-9]{1,2}$ ]]; then
            echo "Release version must match 1.X.XX (examples: 1.0.0, 1.2.9, 1.4.12)." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release JAR
        run: ./gradlew clean shadowJar --stacktrace -PpaperApiVersion=26.2.build.+ -PbuildVersion=${{ steps.version.outputs.version }}

      - name: Locate SF_IE2Legacy release JAR
        id: jar
        shell: bash
        run: |
          JAR="build/libs/SF_IE2Legacy${{ steps.version.outputs.version }}.jar"
          test -s "$JAR"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          sha256sum "$JAR"

      - name: Stage versioned Legacy release JAR
        id: staged
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          OUTPUT="dist/SF_InfinityExpansion2_Legacy_v${{ steps.version.outputs.version }}.jar"
          cp "${{ steps.jar.outputs.path }}" "$OUTPUT"
          test -s "$OUTPUT"
          echo "path=$OUTPUT" >> "$GITHUB_OUTPUT"
          sha256sum "$OUTPUT"

      - name: Upload direct workflow JAR
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.staged.outputs.path }}
          archive: false
          if-no-files-found: error

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          JAR="${{ steps.staged.outputs.path }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --generate-notes --title "IE2 Legacy $TAG"
          fi
